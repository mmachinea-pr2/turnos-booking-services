spring.application.name=turnos-booking-services
server.address=${BOOKING_APP_HOST:127.0.0.1}
server.port=${BOOKING_APP_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

spring.datasource.url=jdbc:mysql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:3309}/${BOOKING_DB_NAME}
spring.datasource.username=${BOOKING_DB_USER}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
