spring.application.name=turnos-booking-services
server.address=${BOOKING_APP_HOST:127.0.0.1}
server.port=${BOOKING_APP_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false

spring.datasource.url=jdbc:mysql://${BOOKING_DB_HOST:localhost}:${BOOKING_DB_PORT:3309}/${BOOKING_DB_NAME}
spring.datasource.username=${BOOKING_DB_USER}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

booking.security.secret=${BOOKING_JWT_SECRET}
booking.security.issuer=${BOOKING_JWT_ISSUER:turnos-booking}
booking.security.audience=${BOOKING_JWT_AUDIENCE:turnos-backends}
booking.security.ttl=${BOOKING_JWT_TTL:30m}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
booking.security.allowed-origins=${BOOKING_CORS_ALLOWED_ORIGINS:}

booking.catalog.base-url=${BOOKING_CATALOG_BASE_URL:http://localhost:8080}
booking.catedra.base-url=${BOOKING_CATEDRA_BASE_URL:http://172.17.201.1:8090}
booking.catedra.token=${BOOKING_CATEDRA_TOKEN:}
booking.availability.zone=${BOOKING_AVAILABILITY_ZONE:America/Argentina/Mendoza}
